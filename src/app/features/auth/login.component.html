<div class="login-wrapper">
  <div class="login-card">

    <!-- Logo / App title -->
    <div class="login-header">
      <i class="bi bi-boxes"></i>
      <h2>Stock Management</h2>
      <p>Sign in to your account</p>
    </div>

    <!-- Error alert — only shown when errorMessage is set -->
    <div class="alert alert-danger" *ngIf="errorMessage">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      {{ errorMessage }}
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <!-- Username field -->
      <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-person"></i>
          </span>
          <input
            type="text"
            class="form-control"
            formControlName="username"
            placeholder="Enter username"
            [class.is-invalid]="f['username'].invalid && f['username'].touched"
          />
          <!-- Validation error shown only after user touches the field -->
          <div class="invalid-feedback" *ngIf="f['username'].errors?.['required']">
            Username is required
          </div>
        </div>
      </div>

      <!-- Password field -->
      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-lock"></i>
          </span>
          <input
            type="password"
            class="form-control"
            formControlName="password"
            placeholder="Enter password"
            [class.is-invalid]="f['password'].invalid && f['password'].touched"
          />
          <div class="invalid-feedback" *ngIf="f['password'].errors?.['required']">
            Password is required
          </div>
          <div class="invalid-feedback" *ngIf="f['password'].errors?.['minlength']">
            Minimum 4 characters required
          </div>
        </div>
      </div>

      <!-- Submit button -->
      <button
        type="submit"
        class="btn btn-primary w-100"
        [disabled]="isLoading"
      >
        <!-- Spinner shown while API call is in progress -->
        <span
          *ngIf="isLoading"
          class="spinner-border spinner-border-sm me-2"
        ></span>
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>

    </form>
  </div>
</div>
